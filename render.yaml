# Render Blueprint: New > Blueprint > pick this repo. Creates the app and a free Redis (Key Value).
services:
  - type: web
    name: jobpilot
    runtime: docker
    plan: free
    region: singapore            # closest Render region to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jobpilot-redis
          property: connectionString
      - key: JOB_TTL
        value: "3600"            # temp files deleted 1 hour after last use
      - key: LATEX_ENGINE
        value: pdflatex
      - key: COMPILE_TIMEOUT
        value: "60"              # free plan has 0.1 CPU
      - key: WORKER_CONCURRENCY
        value: "2"               # free instance: 512 MB RAM, 0.1 CPU
      - key: APP_TOKEN
        generateValue: true      # copy it from the dashboard and paste into the page
      - key: CORS_ORIGINS
        value: https://jobpilot.vercel.app    # change to your Vercel URL (comma-separate several)
      - key: HOURLY_LIMIT
        value: "20"              # analyses per IP per hour; protects your Groq quota
      - key: GROQ_API_KEY
        sync: false              # you enter it in the dashboard
      - key: GROQ_MODELS
        value: llama-3.3-70b-versatile,openai/gpt-oss-120b,qwen/qwen3-32b,meta-llama/llama-4-scout-17b-16e-instruct,llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false

  - type: keyvalue
    name: jobpilot-redis
    plan: free
    region: singapore
    ipAllowList: []              # only reachable from your Render services
    maxmemoryPolicy: volatile-lru     # evict only expiring keys (cache, events), never the queue
