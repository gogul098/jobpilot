services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # jobs and events survive restarts
    volumes: [redis:/data]

  api:
    build: .
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379/0" }
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes: [jobtmp:/tmp/jobpilot]   # shared temp folder, swept every 5 min
    depends_on: [redis]

  worker:
    build: .
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379/0" }
    command: ["arq", "app.worker.WorkerSettings"]
    volumes: [jobtmp:/tmp/jobpilot]   # shared temp folder, swept every 5 min
    depends_on: [redis]

volumes:
  redis: {}
  jobtmp:
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=1000,mode=0700" }   # in memory, gone on restart
